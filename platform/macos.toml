# platform/macos — macOS system defaults
#
# Opinionated but mainstream defaults using fields implemented by Nex 0.25.x.
# Keep this fragment aligned with `src/ops/profile.rs::ProfileMacos` in Nex;
# unknown TOML keys are ignored by serde and create false confidence.

[fragment]
schema      = "io.styrene.nex.profile-fragment.v1"
id          = "platform/macos"
name        = "macos"
version     = "0.1.1"
description = "macOS system defaults — keyboard, trackpad, Finder, dock, appearance"
category    = "platform"
platforms   = ["macos"]
visibility  = "public"

[packages]
nix = [
  "bash",
]
brews = []
casks = []

# ── Implemented top-level macOS defaults ─────────────────────────────────
[macos]
show_all_extensions = true
show_hidden_files   = true
auto_capitalize     = false
auto_correct        = false
natural_scroll      = true
tap_to_click        = true
three_finger_drag   = true
dock_autohide       = true
dock_show_recents   = false

# ── Dock ──────────────────────────────────────────────────────────────
[macos.dock]
persistent_apps = [
  "Finder",
  "Firefox",
  "kitty",
  "System Settings",
]

# ── Input ─────────────────────────────────────────────────────────────
[macos.input]
key_repeat         = 2
initial_key_repeat = 15
press_and_hold     = false

# ── Finder ────────────────────────────────────────────────────────────
[macos.finder]
show_extensions          = true
show_path_bar            = true
show_status_bar          = true
default_view             = "list"
search_scope             = "current"
warn_on_extension_change = false

# ── Screenshots ───────────────────────────────────────────────────────
[macos.screenshots]
location       = "~/Screenshots"
disable_shadow = true

# ── Appearance ────────────────────────────────────────────────────────
[macos.appearance]
dark_mode         = true
sidebar_icon_size = 2

# ── Security / Auth ──────────────────────────────────────────────────
[security]
touchid_sudo = true

[fragment.safety]
mutates_system_services = true
mutates_hardware_drivers = false
requires_confirmation = true
