# Example: Mac developer workstation (composed profile)
#
# This mirrors the repo-level styrene-lab/nex-profiles profile:
#   core/essentials + platform/macos + shell/bash + role/dev-macos
#
# Use this as a reference for building your own public Mac base. Put private
# identity, SSH, kubeconfig, and personal Dock/browser preferences in an overlay.

[meta]
name        = "mac-dev"
description = "Example — Mac developer workstation composed from fragments"
compose = [
  "core/essentials",
  "platform/macos",
  "shell/bash",
  "role/dev-macos",
]

# Inline sections here are intentionally minimal. The fragments above own the
# reusable behavior; overlays should provide person- or machine-specific values.

[git]
# Override these in your private overlay before committing real work.
name  = "Your Name"
email = "you@example.com"
