# nex profile — https://nex.styrene.io
# Canonical public Mac developer composition.
#
# Apply this profile to a new Mac:
#   nex init
#   nex profile apply styrene-lab/nex-profiles
#
# Private machine/person-specific config should live in an overlay such as
# cwilson613/nex-personal, not in this public base.

[meta]
name = "mac-dev"
description = "Mac developer workstation — composed from reusable Styrene fragments"
compose = [
  "core/essentials",
  "platform/macos",
  "shell/bash",
  "role/dev-macos",
]
